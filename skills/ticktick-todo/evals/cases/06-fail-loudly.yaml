# ─────────────────────────────────────────────────────────────
# 失败要响，不能静默。
#
# 脚本目前最大的结构性问题不是算错，而是**算错了还返回 0**：
#   08_50 → 09:00 这种输入，bash 算术报错只写到 stderr，
#   脚本继续往下跑，最终 open 一个"看起来正常但时间错了"的 URL。
#   用户以为任务建好了。
#
# 这条用例专门钉住"别静默"这个契约：
#   只要出现了 "value too great for base" 这类错误，
#   就要求 stderr 有信号 / 或退出码非 0。
#   现在它红着，修法很简单：在脚本顶上加 set -euo pipefail，
#   或改成 10#hour 让算术根本不报错。
# ─────────────────────────────────────────────────────────────
case: invalid_hour_fails_loudly
note: 20:75 不是合法分钟，应拒绝执行；当前会造出 21:15 这种非法时刻

allow_fail: true

args: ["英语课", "2026-03-02 20:75", "", "🧚提子"]

checks:
  # 契约：非法时刻 → stderr 有明确报错、退出码非 0。
  #
  # 为什么不用 25:00？因为脚本有正则兜底：`[0-9]{1,2}:[0-9]{2}` 匹配不上
  # 24:xx 这种时辰，会退化成「全天任务」——看着错，但至少没编出一个假时间。
  # 20:75 分钟非法但格式合法，会真的走进算术，算出 21:15。
  # 选输入时一定要选"能真正走到出问题的那个分支"的。
  - kind: direct
    param: stderr_matches
    value: 'error|invalid|错误|range'
  - kind: exit
    param: "1"
