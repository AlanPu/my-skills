# ─────────────────────────────────────────────────────────────
# 边界时间：减 10 分钟会跨小时 / 跨天。
#
# 注意 00:05 这个用例：期望值是"前一天 23:55"。按当前脚本的实现
# （只对分钟做回绕，回绕时把日期也回退一天）它必然是红的——
# 用它来演示 allow_fail 的用法：把"已确认的 skill bug"登记在案，
# 而不是删掉这条用例假装没这回事。
# ─────────────────────────────────────────────────────────────
case: midnight_wrap_00_05
note: 期望回退到前一天 23:55；当前脚本只看时间不看日期，已知失败

allow_fail: true

args: ["英语课", "2026-03-02 00:05", "", "🧚提子"]

checks:
  # 正确行为：2026-03-02 00:05 → 2026-03-01 23:55
  - kind: url
    param: startDate
    value: "2026-03-01T23:55:00.000"
  # 内容仍显示原始时间
  - kind: url_encoded
    param: content
    value: "英语课 2026-03-02 00:05"
  - kind: exit
    param: "0"
