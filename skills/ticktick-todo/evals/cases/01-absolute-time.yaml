# ─────────────────────────────────────────────────────────────
# 绝对时间：最基础、最稳定的用例。
# 不依赖"今天几号"，任何时间、任何机器跑结果都一样。
# 这类用例是评测的主力——先把它们写满，再加依赖时钟的用例。
# ─────────────────────────────────────────────────────────────
case: absolute_time_subtracts_10_minutes
note: 核心契约——开始时间提前 10 分钟，内容保留原始时间

args: ["英语课", "2026-03-02 20:00", "", "🧚提子"]

checks:
  # ① URL 结构：能下断言的前提是 URL 对得上官方格式
  - kind: url_regex
    param: startDate
    value: '^2026-03-02T'
  - kind: url
    param: startDate
    value: "2026-03-02T19:50:00.000"
  - kind: url
    param: allDay
    value: "false"
  # ② 内容里必须是"原始时间"，不是减完的 19:50
  - kind: url_encoded
    param: content
    value: "英语课 2026-03-02 20:00"
  # ③ 名字/清单原样传递
  - kind: url
    param: title
    value: "英语课"
  - kind: url
    param: list
    value: "🧚提子"
  # ④ 没有重复构造
  - kind: direct
    param: count
    value: "1"
  # ⑤ 退出码 0（脚本"跑完了"≠"做对了"，所以单独一条）
  - kind: exit
    param: "0"
