# ─────────────────────────────────────────────────────────────
# 前导零：bash 会把 09 / 08 / 07 当成八进制。
# 这是评测里最便宜、最值钱的一类用例——只要跑一个数字开头是 0 的时辰，
# 就能抓到 "value too great for base" 这种算术错误。
#
# 当前脚本的 subtract_10_minutes 用 $((hour - 1))，故意不补 10#，
# 所以 09:30 会算出 00:20。放进 Known-Fail，等着被修好后"变绿"。
# ─────────────────────────────────────────────────────────────
case: leading_zero_hour_09_30
note: 09:30 应得 09:20；bash 八进制解析导致 00:20，已知失败

allow_fail: true

args: ["英语课", "2026-03-02 09:30", "", "🧚提子"]

checks:
  - kind: url
    param: startDate
    value: "2026-03-02T09:20:00.000"
  # allDay=false 说明脚本"以为"自己算出了时刻——它不是退化成全天任务，而是算错
  - kind: url
    param: allDay
    value: "false"
  - kind: url_encoded
    param: content
    value: "英语课 2026-03-02 09:30"
