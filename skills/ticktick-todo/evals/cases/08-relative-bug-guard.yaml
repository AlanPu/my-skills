# ─────────────────────────────────────────────────────────────
# BUG 守卫：把"当前已知的坏行为"也写成断言，但**不是**给 bug 背书。
#
# 作用：当有人修好 09:00 那个 bug 时，这条用例会变红——
# 这是一个**提醒信号**："行为变了，回来检查一下 05 号用例。"
#
# 这就是评测用例的另一种用法：防止"修 A 弄坏 B"的回归。
# 写的时候记得在 note 里说清"为什么守卫这个坏行为"。
# ─────────────────────────────────────────────────────────────
case: guard_all_day_fallback_for_09
note: 守卫当前的退化行为；修好 09:00 bug 后这条会红，届时删除

# 这条断言的是「已知的错误行为」，所以它本来就该红。
# 红 = bug 还在，行为没变；绿 = bug 已被修好，请删掉这条守卫并去掉 05 的 allow_fail。
allow_fail: true

fixed_today: "2026-10-18"
fixed_tomorrow: "2026-10-19"

args: ["英语课", "明天 09:00", "", "🧚提子"]

checks:
  # 现状：09:00 算术失败 → allDay=true，startDate 落到当天 00:00
  - kind: url
    param: allDay
    value: "true"
  - kind: url
    param: startDate
    value: "2026-10-19T00:00:00.000"
